name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node cli.mjs build --root examples/minimal
      - run: node --test tests/document-bundle.test.mjs
        env:
          REIFY_BUILD_DIR: examples/minimal/dist
      - run: npm pack --pack-destination "$RUNNER_TEMP"
